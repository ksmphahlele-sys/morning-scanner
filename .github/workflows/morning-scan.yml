name: Morning Scan

on:
  schedule:
    # 05:00 UTC = 07:00 South Africa time, Monday to Friday
    - cron: "0 5 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button for manual tests

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
